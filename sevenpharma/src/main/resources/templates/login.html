<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - SEVEN PHARMA</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">SEVEN PHARMA</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/licitaciones}">Licitaciones</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/entregas}">Entregas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reportes}">Reportes</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center vh-100">
    
    <div class="card shadow p-4">
        
        <h3 class="text-center mb-4">
            Sistema de Gestión de Licitaciones
        </h3>
        
        <form th:action="@{/login}" method="post">
            
            <div class="mb-3">
                <label for="username" class="form-label">
                    Usuario
                </label>
                <input type="text" class="form-control" id="username" name="username">
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">
                    Contraseña
                </label>
                <input type="password" class="form-control" id="password" name="password">
            </div>
            
            <button type="submit" class="btn btn-primary w-100">
                Iniciar Sesión
            </button>
            
        </form>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
